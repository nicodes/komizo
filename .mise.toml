[tools]
# Must be >= the `go` directive in go.mod, which is currently 1.26.
#
# CI used to read the version straight out of go.mod via setup-go, so there was
# only ever one place for it to live. Moving to mise makes the toolchain
# consistent across the fleet but creates a second place -- and a pin that
# silently disagrees with go.mod is not hypothetical here: astry ran 1.24.5
# against a go.mod asking for 1.25, and it built only because GOTOOLCHAIN=auto
# downloaded the real one behind the pin, so the pin described nothing.
#
# The "Toolchain pins agree" step in ci.yml is what stops that happening again.
# If you bump go.mod, bump this too; CI will tell you if you forget.
go = "1.26"

# ONE shellcheck, so "shellcheck clean" means one thing -- komizo#59.
#
# It did not. CI installed whatever apt had (0.9.0 on ubuntu-latest) and `make
# check` preferred a local shellcheck, falling back to koalaman/shellcheck:stable
# (0.11.0). Those are different tools with different rules, and the disagreement
# is not hypothetical: 0.9.0 raises SC2015 on `A && B || continue` while 0.11.0
# suppresses it, because `continue` is flow control and the note does not apply.
# A change verified locally therefore failed CI, on a line that was correct.
#
# Six shell programs komizo writes onto a box are now linted rather than one, so
# an ambiguous "clean" costs six times what it used to. This is the pin; the
# Makefile reads it out of here for its docker fallback and CI asserts against
# it, so there is one number and everything else derives from it.
shellcheck = "0.11.0"
