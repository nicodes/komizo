name: Security Scan
'on':
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: security-scan
  cancel-in-progress: false
jobs:
  verify:
    name: Scan dependencies
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
    - name: Check out source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
      timeout-minutes: 5
    - name: Set up development tools
      uses: nicodes/tools/setup@f412061a7a3f0914db9e09d1159e69504aee8706
      env:
        GH_TOKEN: ${{ github.token }}
      timeout-minutes: 5
    - name: Security Scan
      run: mise run security-scan
      timeout-minutes: 90
    permissions:
      contents: read
      attestations: read
