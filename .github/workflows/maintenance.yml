name: Maintenance
'on':
  workflow_dispatch:
    inputs:
      task:
        description: Maintenance task
        type: choice
        options:
        - dependencies
        default: dependencies
permissions:
  contents: read
  issues: write
concurrency:
  group: dependency-maintenance
  cancel-in-progress: false
jobs:
  verify:
    name: Check dependencies
    if: github.ref == 'refs/heads/main' && inputs.task == 'dependencies'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - name: Check out source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
      timeout-minutes: 5
    - name: Set up development tools
      with:
        tools: python
      uses: nicodes/tools/setup@48fb94fd811c3594489aa3af34f94903cfdb48f7
      env:
        GH_TOKEN: ${{ github.token }}
      timeout-minutes: 5
    - name: Dependency maintenance
      run: mise exec -- python3 "$TOOLS_ROOT/helpers/watch-tools.py"
      timeout-minutes: 25
      env:
        GH_TOKEN: ${{ github.token }}
    permissions:
      contents: read
      issues: write
      attestations: read
