name: Dependency Maintenance
'on':
  workflow_dispatch: null
permissions:
  contents: read
  issues: write
concurrency:
  group: dependency-maintenance
  cancel-in-progress: false
jobs:
  verify:
    name: Check dependencies
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - name: Check out source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
      timeout-minutes: 5
    - name: Set up locked komizo
      uses: nicodes/komizo/setup@54da2b6d20fda9febf3cd02039424a1a8249cffb
      env:
        GH_TOKEN: ${{ github.token }}
      timeout-minutes: 5
    - name: Dependency Maintenance
      run: komizo run --timeout 7200s dependency-maintenance
      timeout-minutes: 25
      env:
        GH_TOKEN: ${{ github.token }}
    permissions:
      contents: read
      issues: write
      attestations: read
