name: Release
'on':
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        type: choice
        options:
        - patch
        - minor
        - major
permissions: {}
concurrency: release-${{ github.repository }}
jobs:
  release:
    name: Build release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      candidate-artifact: ${{ steps.candidates.outputs.artifact-id }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
    - name: Check out source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      timeout-minutes: 5
      with:
        fetch-depth: 0
    - name: Set up development tools
      uses: nicodes/tools/setup@87da2fe9d430c67d15f62f603b07ba1ed40b5603
      env:
        GH_TOKEN: ${{ github.token }}
      timeout-minutes: 5
    - name: Determine release version
      timeout-minutes: 5
      id: release
      env:
        BUMP: ${{ inputs.bump }}
      run: |-
        set -euo pipefail
        if [ "$GITHUB_REF" != "refs/heads/main" ]; then
          echo 'Run releases from the main branch.' >&2
          exit 1
        fi
        git fetch --tags --force
        latest="$(git tag --list 'v[0-9]*' | sed -E 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
        if [ -z "$latest" ]; then
          version="0.0.1"
        else
          IFS=. read -r major minor patch <<< "$latest"
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
            *) echo "Unsupported bump: $BUMP" >&2; exit 1 ;;
          esac
          version="${major}.${minor}.${patch}"
        fi
        tag="v${version}"
        if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
          echo "Tag already exists: $tag" >&2
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
    - name: Cache Go build
      timeout-minutes: 10
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: go-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum', 'mise.toml') }}-${{ github.sha
          }}
        restore-keys: |
          go-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum', 'mise.toml') }}-
    - name: Build
      timeout-minutes: 15
      run: mise run install build artifact-check
      env:
        VERSION: ${{ steps.release.outputs.version }}
    - name: Test
      timeout-minutes: 15
      run: mise run lint test vuln
    - name: Attest build provenance
      timeout-minutes: 5
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
      with:
        subject-path: dist/*.tar.gz
    - name: Upload artifacts
      id: candidates
      timeout-minutes: 5
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: komizo-release-candidates-${{ github.run_attempt }}
        path: |
          dist/*.tar.gz
          dist/checksums.txt
        if-no-files-found: error
        retention-days: 7
  native-acceptance:
    name: Verify release
    needs: release
    outputs:
      evidence-artifact: ${{ steps.evidence.outputs.artifact-id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: read
      actions: read
      attestations: read
    steps:
    - name: Check out source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      timeout-minutes: 5
      with:
        persist-credentials: false
    - name: Download artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      timeout-minutes: 5
      with:
        artifact-ids: ${{ needs.release.outputs.candidate-artifact }}
        merge-multiple: true
        path: candidate-release
    - name: Verify released bytes and run disposable lifecycle
      timeout-minutes: 35
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ needs.release.outputs.tag }}
      shell: bash
      run: |-
        set -euo pipefail
        sudo install -d -m 700 /root/komizo-native-release/release
        sudo install -m 600 candidate-release/komizo_Linux_x86_64.tar.gz candidate-release/checksums.txt /root/komizo-native-release/release/
        sudo --preserve-env=GH_TOKEN /usr/bin/python3 tools/engineering/cold-lifecycle-acceptance.py \
          --release "$RELEASE_TAG" --source "$GITHUB_SHA" \
          --release-dir /root/komizo-native-release/release \
          --output /root/komizo-native-release/observations
    - name: Export only validated nonsecret evidence
      timeout-minutes: 2
      if: always()
      env:
        RELEASE_TAG: ${{ needs.release.outputs.tag }}
      run: |-
        sudo /usr/bin/python3 tools/engineering/release_acceptance.py \
          --observations /root/komizo-native-release/observations \
          --output "$GITHUB_WORKSPACE/native-results" --release "$RELEASE_TAG" --source "$GITHUB_SHA"
    - name: Upload artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      id: evidence
      timeout-minutes: 3
      if: always()
      with:
        name: komizo-native-acceptance-${{ github.run_attempt }}
        path: native-results/
        if-no-files-found: error
        retention-days: 30
  promote:
    name: Publish release
    needs:
    - release
    - native-acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
    - name: Check out source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      timeout-minutes: 5
      with:
        persist-credentials: false
    - name: Download artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      timeout-minutes: 5
      with:
        artifact-ids: ${{ needs.native-acceptance.outputs.evidence-artifact }}
        merge-multiple: true
        path: native-results
    - name: Download artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      timeout-minutes: 5
      with:
        artifact-ids: ${{ needs.release.outputs.candidate-artifact }}
        merge-multiple: true
        path: dist
    - name: Recheck exact-source evidence
      timeout-minutes: 2
      env:
        RELEASE_TAG: ${{ needs.release.outputs.tag }}
      run: |-
        python3 tools/engineering/release_acceptance.py --bundle native-results --artifacts dist \
          --release "$RELEASE_TAG" --source "$GITHUB_SHA"
    - name: Attest build provenance
      timeout-minutes: 5
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
      with:
        subject-path: native-results/komizo-*.json
    - name: Verify accepted archive provenance
      timeout-minutes: 5
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ needs.release.outputs.tag }}
      run: |-
        set -euo pipefail
        gh attestation verify dist/komizo_Linux_x86_64.tar.gz --repo "$GITHUB_REPOSITORY" \
          --cert-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/heads/main" \
          --cert-oidc-issuer https://token.actions.githubusercontent.com \
          --signer-digest "$GITHUB_SHA" --source-digest "$GITHUB_SHA" \
          --source-ref refs/heads/main --deny-self-hosted-runners
    - name: Select accepted release payload
      run: |-
        set -euo pipefail
        mkdir accepted-release
        cp dist/*.tar.gz dist/checksums.txt native-results/komizo-acceptance.json native-results/komizo-performance.json accepted-release/
    - name: Upload accepted release artifacts
      id: accepted
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: accepted-cli-${{ github.sha }}-${{ github.run_attempt }}
        path: accepted-release/
        if-no-files-found: error
        retention-days: 7
    outputs:
      artifact-id: ${{ steps.accepted.outputs.artifact-id }}
  publish:
    name: Publish release
    needs:
    - release
    - promote
    uses: nicodes/tools/.github/workflows/cli-publish.yml@87da2fe9d430c67d15f62f603b07ba1ed40b5603
    permissions:
      contents: write
    with:
      tools-ref: 87da2fe9d430c67d15f62f603b07ba1ed40b5603
      binary: komizo
      tag: ${{ needs.release.outputs.tag }}
      artifact-id: ${{ needs.promote.outputs.artifact-id }}
      extra-files: komizo-acceptance.json komizo-performance.json
