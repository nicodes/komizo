# Generated cookbook caller. Change recipe data and regenerate.
# Attestation stays in this source workflow to preserve published installer trust.
name: Release
'on':
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        type: choice
        default: patch
        options: [patch, minor, major]
permissions: {}
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  identity:
    name: Select immutable release identity
    permissions:
      contents: read
    uses: nicodes/cookbook/.github/workflows/cookbook-cli-identity.yml@c2527e643f6be163ba31acb266a88b5e71734178
    with:
      cookbook-ref: c2527e643f6be163ba31acb266a88b5e71734178
      bump: ${{ inputs.bump }}
  validate:
    name: Validate release source and native archives
    needs: identity
    permissions:
      contents: read
      actions: read
      pull-requests: read
    uses: nicodes/cookbook/.github/workflows/cookbook-native.yml@c2527e643f6be163ba31acb266a88b5e71734178
    with:
      cookbook-ref: c2527e643f6be163ba31acb266a88b5e71734178
      source: ${{ github.sha }}
      version: ${{ needs.identity.outputs.version }}
      date: ${{ needs.identity.outputs.date }}
      runner: ubuntu-24.04
      timeout-minutes: 110
  accept:
    name: Attest accepted source archives
    needs: [identity, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: read
      actions: read
      attestations: write
      id-token: write
    outputs:
      artifact: ${{ steps.accepted.outputs.artifact-id }}
    env:
      SOURCE_SHA: ${{ github.sha }}
      COOKBOOK_SHA: c2527e643f6be163ba31acb266a88b5e71734178
      RELEASE_TAG: ${{ needs.identity.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require an accepted provider and explicit source dispatch
        run: |
          set -euo pipefail
          [[ "$COOKBOOK_SHA" =~ ^[a-f0-9]{40}$ && "$GITHUB_REF" == refs/heads/main && "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
          relation="$(gh api "repos/nicodes/cookbook/compare/$COOKBOOK_SHA...main" --jq .status)"
          [[ "$relation" == ahead || "$relation" == identical ]]
      - name: Check out exact source data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare the provider interpreter without caller configuration
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13.11'
          check-latest: false
      - name: Check out accepted Cookbook
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: nicodes/cookbook
          ref: c2527e643f6be163ba31acb266a88b5e71734178
          path: .artifacts/recipe-sdks/_cookbook
          persist-credentials: false
      - name: Prepare separate immutable Cookbook and Tools sources
        uses: ./.artifacts/recipe-sdks/_cookbook/sdk-dependencies
        with:
          cookbook-ref: c2527e643f6be163ba31acb266a88b5e71734178
      - name: Download this execution's complete source acceptance
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: cookbook-full-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/cli-input/full
      - name: Stage only closed original archive and proof data
        run: python3 -I -B -c 'import pathlib,runpy,sys;p=pathlib.Path(sys.argv[1]);sys.argv=sys.argv[1:];sys.path.insert(0,str(p.parent));runpy.run_path(str(p),run_name="__main__")' .artifacts/recipe-sdks/_cookbook/cookbook/cli_inputs.py --input full
      - name: Recheck complete native and host proof and exact publication bytes
        run: python3 -I -B -c 'import pathlib,runpy,sys;p=pathlib.Path(sys.argv[1]);sys.argv=sys.argv[1:];sys.path.insert(0,str(p.parent));runpy.run_path(str(p),run_name="__main__")' .artifacts/recipe-sdks/_cookbook/cookbook/cli_release.py accept --source "$SOURCE_SHA" --cookbook-ref "$COOKBOOK_SHA" --tag "$RELEASE_TAG" --before-acceptance
      - name: Attest build provenance under the published source workflow identity
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: dist/*
      - name: Preserve original accepted archives and source proof
        id: accepted
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: accepted-cli-archives-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            dist/
            .artifacts/cookbook-validation.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  product-acceptance:
    name: Verify product release
    needs: [identity, accept]
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: read
      actions: read
      attestations: read
    outputs:
      artifact: ${{ steps.evidence.outputs.artifact-id }}
    env:
      SOURCE_SHA: ${{ github.sha }}
      COOKBOOK_SHA: c2527e643f6be163ba31acb266a88b5e71734178
      RELEASE_TAG: ${{ needs.identity.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require an accepted provider and explicit source dispatch
        run: |
          set -euo pipefail
          [[ "$COOKBOOK_SHA" =~ ^[a-f0-9]{40}$ && "$GITHUB_REF" == refs/heads/main && "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
          relation="$(gh api "repos/nicodes/cookbook/compare/$COOKBOOK_SHA...main" --jq .status)"
          [[ "$relation" == ahead || "$relation" == identical ]]
      - name: Check out exact source data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare the provider interpreter without caller configuration
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13.11'
          check-latest: false
      - name: Check out accepted Cookbook
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: nicodes/cookbook
          ref: c2527e643f6be163ba31acb266a88b5e71734178
          path: .artifacts/recipe-sdks/_cookbook
          persist-credentials: false
      - name: Prepare separate immutable Cookbook and Tools sources
        uses: ./.artifacts/recipe-sdks/_cookbook/sdk-dependencies
        with:
          cookbook-ref: c2527e643f6be163ba31acb266a88b5e71734178
      - name: Download original authenticated native archives and source proof
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.accept.outputs.artifact }}
          path: .artifacts/cli-input/archives
      - name: Stage only authenticated native archive and proof data
        run: python3 -I -B -c 'import pathlib,runpy,sys;p=pathlib.Path(sys.argv[1]);sys.argv=sys.argv[1:];sys.path.insert(0,str(p.parent));runpy.run_path(str(p),run_name="__main__")' .artifacts/recipe-sdks/_cookbook/cookbook/cli_inputs.py --input archives
      - name: Run owned lifecycle assertions and verification without signing or publication authority
        id: domain
        run: python3 -I -B -c 'import pathlib,runpy,sys;p=pathlib.Path(sys.argv[1]);sys.argv=sys.argv[1:];sys.path.insert(0,str(p.parent));runpy.run_path(str(p),run_name="__main__")' .artifacts/recipe-sdks/_cookbook/cookbook/cli_release.py acceptance --source "$SOURCE_SHA" --cookbook-ref "$COOKBOOK_SHA" --tag "$RELEASE_TAG"
      - name: Preserve only declared nonsecret assertion diagnostics on failure
        if: failure() && steps.domain.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cli-acceptance-failure-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            .artifacts/cli-publication-evidence/cleanup-status.json
            .artifacts/cli-publication-evidence/status.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
      - name: Preserve only declared product evidence and its bound receipt
        id: evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: accepted-cli-product-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            .artifacts/cli-publication-evidence/receipt.json
            .artifacts/cli-publication-evidence/komizo-acceptance.json
            .artifacts/cli-publication-evidence/komizo-performance.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  attest-evidence:
    name: Attest accepted product evidence
    needs: [identity, accept, product-acceptance]
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: read
      actions: read
      attestations: write
      id-token: write
    outputs:
      artifact: ${{ steps.accepted.outputs.artifact-id }}
    env:
      SOURCE_SHA: ${{ github.sha }}
      COOKBOOK_SHA: c2527e643f6be163ba31acb266a88b5e71734178
      RELEASE_TAG: ${{ needs.identity.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require an accepted provider and explicit source dispatch
        run: |
          set -euo pipefail
          [[ "$COOKBOOK_SHA" =~ ^[a-f0-9]{40}$ && "$GITHUB_REF" == refs/heads/main && "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
          relation="$(gh api "repos/nicodes/cookbook/compare/$COOKBOOK_SHA...main" --jq .status)"
          [[ "$relation" == ahead || "$relation" == identical ]]
      - name: Check out exact source data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare the provider interpreter without caller configuration
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13.11'
          check-latest: false
      - name: Check out accepted Cookbook
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: nicodes/cookbook
          ref: c2527e643f6be163ba31acb266a88b5e71734178
          path: .artifacts/recipe-sdks/_cookbook
          persist-credentials: false
      - name: Prepare separate immutable Cookbook and Tools sources
        uses: ./.artifacts/recipe-sdks/_cookbook/sdk-dependencies
        with:
          cookbook-ref: c2527e643f6be163ba31acb266a88b5e71734178
      - name: Download original accepted archives independently of product execution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.accept.outputs.artifact }}
          path: .artifacts/cli-input/archives
      - name: Download only the product evidence handoff
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.product-acceptance.outputs.artifact }}
          path: .artifacts/cli-input/product
      - name: Stage original archives and closed product evidence without source overlays
        run: python3 -I -B -c 'import pathlib,runpy,sys;p=pathlib.Path(sys.argv[1]);sys.argv=sys.argv[1:];sys.path.insert(0,str(p.parent));runpy.run_path(str(p),run_name="__main__")' .artifacts/recipe-sdks/_cookbook/cookbook/cli_inputs.py --input archives --product
      - name: Admit source-bound evidence and actual read-only execution without product execution
        run: python3 -I -B -c 'import pathlib,runpy,sys;p=pathlib.Path(sys.argv[1]);sys.argv=sys.argv[1:];sys.path.insert(0,str(p.parent));runpy.run_path(str(p),run_name="__main__")' .artifacts/recipe-sdks/_cookbook/cookbook/cli_release.py accept --source "$SOURCE_SHA" --cookbook-ref "$COOKBOOK_SHA" --tag "$RELEASE_TAG"
      - name: Attest accepted product release evidence under the published source identity
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            dist/komizo-acceptance.json
            dist/komizo-performance.json
      - name: Preserve the accepted immutable publication payload
        id: accepted
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: accepted-cli-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            dist/
            .artifacts/cookbook-validation.json
            .artifacts/cli-publication-evidence/receipt.json
            .artifacts/cli-publication-evidence/komizo-acceptance.json
            .artifacts/cli-publication-evidence/komizo-performance.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  publish:
    name: Publish immutable release
    needs: [identity, attest-evidence]
    permissions:
      contents: write
      actions: read
      attestations: read
    uses: nicodes/cookbook/.github/workflows/cookbook-cli-publish.yml@c2527e643f6be163ba31acb266a88b5e71734178
    with:
      cookbook-ref: c2527e643f6be163ba31acb266a88b5e71734178
      tag: ${{ needs.identity.outputs.tag }}
      artifact-id: ${{ needs.attest-evidence.outputs.artifact }}
