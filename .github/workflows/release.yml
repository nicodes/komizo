name: Release

# Cut a release: bump the tag, cross-compile, publish archives with checksums
# and build provenance.
#
# The tag is a PLAIN v0.0.1, not a prefixed one. This repository is the Go
# module, so `go install github.com/nicodes/komizo@v0.0.2` only
# resolves if the tag is exactly that. A prefixed tag would publish a release
# nobody could install by version, and `@latest` would go on resolving to a
# pseudo-version of whatever main happened to be.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions: {}

concurrency: release-${{ github.repository }}

jobs:
  release:
    name: "Build release"
    runs-on: ubuntu-latest
    # A BACKSTOP, NOT THE CEILING. The ceiling is on the steps below.
    #
    # nicodes/komizo-be#147 moved this off the job in ci.yml and missed every
    # other workflow. A job's timeout-minutes INCLUDES QUEUE TIME and a step's
    # does not, so this fired most readily on the days GitHub was slowest --
    # and on THIS job a kill lands somewhere particular: it creates a tag, and a
    # tag is the one thing here that cannot be taken back (a Go module version
    # is permanent once anything has fetched it).
    timeout-minutes: 90
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      candidate-artifact: ${{ steps.candidates.outputs.artifact-id }}
    permissions:
      contents: read # build/attest only; publication follows native acceptance
      id-token: write # OIDC identity for build provenance
      attestations: write # record the provenance attestation
    steps:
      - name: "Check out source"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          fetch-depth: 0

      - name: Determine release version
        timeout-minutes: 5
        id: release
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo 'Run releases from the main branch.' >&2
            exit 1
          fi
          git fetch --tags --force
          latest="$(git tag --list 'v[0-9]*' | sed -E 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
          if [ -z "$latest" ]; then
            version="0.0.1"
          else
            IFS=. read -r major minor patch <<< "$latest"
            case "$BUMP" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
              *) echo "Unsupported bump: $BUMP" >&2; exit 1 ;;
            esac
            version="${major}.${minor}.${patch}"
          fi
          tag="v${version}"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag already exists: $tag" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # mise rather than setup-go, so every repository in the fleet installs its
      # toolchain the same way. The cost is that the Go version now lives in
      # .mise.toml as well as go.mod; the step below is what keeps them honest.
      - name: "Set up tools"
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        timeout-minutes: 10

      - name: Toolchain pins agree
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          mod="$(sed -n 's/^go //p' go.mod | head -n1)"
          pin="$(sed -n 's/^go = "\(.*\)"$/\1/p' .mise.toml | head -n1)"
          if [ -z "$mod" ] || [ -z "$pin" ]; then
            echo "::error::could not read the Go version from go.mod ($mod) or .mise.toml ($pin)"
            exit 1
          fi
          if [ "$(printf '%s\n%s\n' "$mod" "$pin" | sort -V | head -n1)" != "$mod" ]; then
            echo "::error::.mise.toml pins Go $pin but go.mod asks for $mod. CI would build against the older one while GOTOOLCHAIN quietly fetched the newer, so the pin would describe nothing."
            exit 1
          fi
          echo "go.mod wants $mod, .mise.toml pins $pin"

      # Reuse compiled inputs for this toolchain/dependency set, then save
      # refreshed compilation state under the exact source revision. The v2
      # namespace starts without the old 1.5 GB unsupported-platform cache.
      - name: Cache Go build
        timeout-minutes: 10
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum', '.mise.toml') }}-${{ github.sha }}
          restore-keys: |
            go-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum', '.mise.toml') }}-

      # The same steps CI runs, from the same definition. Running them again
      # against this exact commit is not redundant: CI passing on this SHA
      # earlier is a claim about that run, and a release is the artefact people
      # actually execute.
      #
      # Build before Test, as CI does and as every other repository does. This
      # file used to run Test first, which is defensible on its own -- do not
      # cross-compile four platforms for a release whose tests fail -- but it
      # made this the one workflow in the organisation with the opposite order,
      # and the exception cost more to remember than the runner minutes it saved
      # on releases that were going to fail anyway.
      - name: Build
        timeout-minutes: 15
        uses: ./.github/actions/build
        with:
          version: ${{ steps.release.outputs.version }}

      - name: Test
        timeout-minutes: 15
        uses: ./.github/actions/test

      # This binary connects to your server AS ROOT and runs shell there, which
      # makes it worth tampering with. checksums.txt only says the archives
      # match a file uploaded by whoever uploaded them; provenance ties them to
      # this workflow, this repository and this commit, and `gh attestation
      # verify` checks that against a public transparency log.
      - name: Attest build provenance
        timeout-minutes: 5
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      - name: "Upload artifacts"
        id: candidates
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: komizo-release-candidates-${{ github.run_attempt }}
          path: |
            dist/*.tar.gz
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 7


  native-acceptance:
    name: "Verify release"
    needs: release
    outputs:
      evidence-artifact: ${{ steps.evidence.outputs.artifact-id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: read
      actions: read
      attestations: read
    steps:
      - name: "Check out source"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          persist-credentials: false
      - name: "Download artifacts"
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        timeout-minutes: 5
        with:
          artifact-ids: ${{ needs.release.outputs.candidate-artifact }}
          merge-multiple: true
          path: candidate-release
      - name: Verify released bytes and run disposable lifecycle
        timeout-minutes: 35
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          sudo install -d -m 700 /root/komizo-native-release/release
          sudo install -m 600 candidate-release/komizo_Linux_x86_64.tar.gz candidate-release/checksums.txt /root/komizo-native-release/release/
          sudo --preserve-env=GH_TOKEN /usr/bin/python3 tools/engineering/cold-lifecycle-acceptance.py \
            --release "$RELEASE_TAG" --source "$GITHUB_SHA" \
            --release-dir /root/komizo-native-release/release \
            --output /root/komizo-native-release/observations
      - name: Export only validated nonsecret evidence
        timeout-minutes: 2
        if: always()
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          sudo /usr/bin/python3 tools/engineering/release_acceptance.py \
            --observations /root/komizo-native-release/observations \
            --output "$GITHUB_WORKSPACE/native-results" --release "$RELEASE_TAG" --source "$GITHUB_SHA"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: evidence
        timeout-minutes: 3
        if: always()
        with:
          name: komizo-native-acceptance-${{ github.run_attempt }}
          path: native-results/
          if-no-files-found: error
          retention-days: 30

  promote:
    name: "Publish release"
    needs: [release, native-acceptance]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: "Check out source"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          persist-credentials: false
      - name: "Download artifacts"
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        timeout-minutes: 5
        with:
          artifact-ids: ${{ needs.native-acceptance.outputs.evidence-artifact }}
          merge-multiple: true
          path: native-results
      - name: "Download artifacts"
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        timeout-minutes: 5
        with:
          artifact-ids: ${{ needs.release.outputs.candidate-artifact }}
          merge-multiple: true
          path: dist
      - name: Recheck exact-source evidence
        timeout-minutes: 2
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          python3 tools/engineering/release_acceptance.py --bundle native-results --artifacts dist \
            --release "$RELEASE_TAG" --source "$GITHUB_SHA"
      - name: "Attest build provenance"
        timeout-minutes: 5
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: native-results/komizo-*.json
      - name: Publish only the accepted release
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh attestation verify dist/komizo_Linux_x86_64.tar.gz --repo "$GITHUB_REPOSITORY" \
            --cert-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/heads/main" \
            --cert-oidc-issuer https://token.actions.githubusercontent.com \
            --signer-digest "$GITHUB_SHA" --source-digest "$GITHUB_SHA" \
            --source-ref refs/heads/main --deny-self-hosted-runners
          gh release create "$RELEASE_TAG" dist/*.tar.gz dist/checksums.txt \
            native-results/komizo-acceptance.json native-results/komizo-performance.json \
            --target "$GITHUB_SHA" --title "$RELEASE_TAG" \
            --notes 'Authenticated archives passed native lifecycle and fixed-budget performance acceptance. Verify archive and acceptance-receipt attestations before use.'
