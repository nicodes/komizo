# Generated cookbook caller. Change recipe data and regenerate.
# Attestation stays in this source workflow to preserve published installer trust.
name: Release
'on':
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        type: choice
        default: patch
        options: [patch, minor, major]
permissions: {}
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  identity:
    name: Select immutable release identity
    permissions:
      contents: read
    uses: nicodes/tools/.github/workflows/cookbook-cli-identity.yml@803fa9540bf684e0b8c64f23d2efbee3dec98efb
    with:
      tools-ref: 803fa9540bf684e0b8c64f23d2efbee3dec98efb
      bump: ${{ inputs.bump }}
  validate:
    name: Validate release source and native archives
    needs: identity
    permissions:
      contents: read
      actions: read
    uses: nicodes/tools/.github/workflows/cookbook-native.yml@803fa9540bf684e0b8c64f23d2efbee3dec98efb
    with:
      tools-ref: 803fa9540bf684e0b8c64f23d2efbee3dec98efb
      source: ${{ github.sha }}
      version: ${{ needs.identity.outputs.version }}
      date: ${{ needs.identity.outputs.date }}
      runner: ubuntu-24.04
      timeout-minutes: 110
  accept:
    name: Attest accepted source archives
    needs: [identity, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: read
      actions: read
      attestations: write
      id-token: write
    outputs:
      artifact: ${{ steps.accepted.outputs.artifact-id }}
    env:
      SOURCE_SHA: ${{ github.sha }}
      COOKBOOK_SHA: 803fa9540bf684e0b8c64f23d2efbee3dec98efb
      RELEASE_TAG: ${{ needs.identity.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check out accepted cookbook
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: nicodes/tools
          ref: 803fa9540bf684e0b8c64f23d2efbee3dec98efb
          path: _cookbook
          persist-credentials: false
      - name: Bootstrap caller-pinned Python
        uses: ./_cookbook/setup
        with:
          tools: python
      - name: Download this execution's complete source acceptance
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: cookbook-full-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .
      - name: Recheck complete native and host proof and exact publication bytes
        run: python3 _cookbook/cookbook/cli_release.py accept --source "$SOURCE_SHA" --tools "$COOKBOOK_SHA" --tag "$RELEASE_TAG" --before-acceptance
      - name: Attest build provenance under the published source workflow identity
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: dist/*
      - name: Run owned lifecycle assertions against authenticated native archives
        id: domain
        run: python3 _cookbook/cookbook/cli_release.py acceptance --source "$SOURCE_SHA" --tools "$COOKBOOK_SHA" --tag "$RELEASE_TAG"
      - name: Attest accepted product release evidence under the published source identity
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            dist/komizo-acceptance.json
            dist/komizo-performance.json
      - name: Recheck native bytes and independently verified release evidence
        run: python3 _cookbook/cookbook/cli_release.py accept --source "$SOURCE_SHA" --tools "$COOKBOOK_SHA" --tag "$RELEASE_TAG"
      - name: Preserve only declared nonsecret assertion diagnostics on failure
        if: failure() && steps.domain.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cli-acceptance-failure-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            .artifacts/cli-publication-evidence/cleanup-status.json
            .artifacts/cli-publication-evidence/status.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
      - name: Preserve accepted publication payload and source proof
        id: accepted
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: accepted-cli-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            dist/
            .artifacts/cookbook-validation.json
            .artifacts/cli-publication-evidence/receipt.json
            .artifacts/cli-publication-evidence/komizo-acceptance.json
            .artifacts/cli-publication-evidence/komizo-performance.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  publish:
    name: Publish immutable release
    needs: [identity, accept]
    permissions:
      contents: write
      actions: read
      attestations: read
    uses: nicodes/tools/.github/workflows/cookbook-cli-publish.yml@803fa9540bf684e0b8c64f23d2efbee3dec98efb
    with:
      tools-ref: 803fa9540bf684e0b8c64f23d2efbee3dec98efb
      tag: ${{ needs.identity.outputs.tag }}
      artifact-id: ${{ needs.accept.outputs.artifact }}
