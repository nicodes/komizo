name: Native host bootstrap and reboot
'on':
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-host-${{ github.ref }}
  cancel-in-progress: true
jobs:
  debian:
    name: Debian 13 native host
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NATIVE_HOST_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        with:
          install: false
          version: 2026.10.17
      - name: Build the exact native controller source
        env:
          CARGO_PROFILE_DEV_DEBUG: '0'
        run: |
          set -euo pipefail
          mise install rust@1.94.0
          mise exec rust@1.94.0 -- cargo build --locked --bin komizo-box --target-dir .artifacts/native-host-build
      - name: Prepare the disposable machine runner
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils acl
          native_runner_uid="$(id -u)"
          sudo setfacl -m "u:$native_runner_uid:rw" /dev/kvm
      - name: Assert native bootstrap, isolation and real reboot
        run: python3 -I -B tests/support/native_host_vm.py --binary .artifacts/native-host-build/debug/komizo-box
      - name: Preserve bounded native host evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-host-${{ env.NATIVE_HOST_SOURCE }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/native-host/
          retention-days: 14
          if-no-files-found: error
