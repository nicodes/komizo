name: Native host bootstrap and reboot
'on':
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-host-${{ github.ref }}
  cancel-in-progress: true
jobs:
  alpine:
    name: Alpine 3.24 native host
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MISE_GITHUB_TOKEN: ${{ github.token }}
      NATIVE_HOST_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify the pinned SDK transport boundary
        timeout-minutes: 1
        run: python3 -I -B tests/acceptance/test_native_sdk.py
      - name: Authenticate the exact SDK through the official asset API
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I -B tests/support/native_host_sdk.py
      - name: Build the exact native controller source
        env:
          CARGO_PROFILE_DEV_DEBUG: '0'
        run: |
          set -euo pipefail
          mise install rust@1.94.0
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools
          mise exec rust@1.94.0 -- rustup target add x86_64-unknown-linux-musl
          mise exec rust@1.94.0 -- cargo build --locked --bin komizo-box --target x86_64-unknown-linux-musl --target-dir .artifacts/native-host-build
      - name: Check out the accepted proxy source closure
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: nicodes/tools
          ref: 7873bb0fdae1726295dbf7f9317c58daa374b2a6
          path: .artifacts/native-proxy-tools
          persist-credentials: false
      - name: Build and audit the exact native proxy
        timeout-minutes: 20
        run: |
          set -euo pipefail
          mise install go@1.27.3 go:golang.org/x/vuln/cmd/govulncheck@1.7.0
          mise exec go@1.27.3 go:golang.org/x/vuln/cmd/govulncheck@1.7.0 -- python3 -I -B tests/support/native_host_proxy.py --tools .artifacts/native-proxy-tools --output .artifacts/native-proxy/caddy_Linux_x86_64
      - name: Select the declared immutable backup provider
        id: backup-provider
        run: |
          python3 -I -B - <<'PY'
          import os, pathlib, re, tomllib
          revision = tomllib.loads(pathlib.Path('mise.toml').read_text())['vars']['cookbook_ref']
          if not re.fullmatch('[a-f0-9]{40}', revision):
              raise ValueError('native backup provider must be immutable')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('revision=' + revision + '\n')
          PY
      - name: Check out the accepted backup provider
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: nicodes/cookbook
          ref: ${{ steps.backup-provider.outputs.revision }}
          path: .artifacts/native-backup-cookbook
          persist-credentials: false
      - name: Prepare the disposable machine runner
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils acl
          native_runner_uid="$(id -u)"
          sudo setfacl -m "u:$native_runner_uid:rw" /dev/kvm
      - name: Assert native bootstrap, isolation and real reboot
        run: python3 -I -B tests/support/native_host_vm.py --binary .artifacts/native-host-build/x86_64-unknown-linux-musl/debug/komizo-box --proxy-binary .artifacts/native-proxy/caddy_Linux_x86_64 --proxy-receipt .artifacts/native-proxy/caddy_Linux_x86_64.json --cookbook-source .artifacts/native-backup-cookbook --tools-source .artifacts/native-proxy-tools
      - name: Preserve bounded native host evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-host-${{ env.NATIVE_HOST_SOURCE }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/native-host/
          retention-days: 14
          if-no-files-found: error
