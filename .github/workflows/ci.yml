# Generated cookbook caller. Change recipe data and regenerate.
name: Build & Test
'on':
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source:
        description: Exact source commit; defaults to this main revision
        type: string
        default: ''
      cookbook:
        description: Accepted cookbook commit; defaults to the pinned recipe
        type: string
        default: ''
permissions: {}
concurrency:
  group: ci-${{ github.ref }}-${{ inputs.source || 'current' }}
  cancel-in-progress: true
jobs:
  validate:
    uses: nicodes/cookbook/.github/workflows/cookbook-ci.yml@2f33aab302c9645f43a5e627850dc06fdba39073
    permissions:
      contents: read
      actions: read
      pull-requests: read
    with:
      cookbook-ref: ${{ inputs.cookbook || '2f33aab302c9645f43a5e627850dc06fdba39073' }}
      source: ${{ inputs.source || github.sha }}
      merge-gate: true
      recipe: rust-cli
      runner: ubuntu-24.04
      timeout-minutes: 110
  complete:
    if: github.event_name == 'pull_request'
    uses: nicodes/cookbook/.github/workflows/cookbook-ci.yml@2f33aab302c9645f43a5e627850dc06fdba39073
    permissions:
      contents: read
      actions: read
      pull-requests: read
    with:
      cookbook-ref: ${{ inputs.cookbook || '2f33aab302c9645f43a5e627850dc06fdba39073' }}
      source: ${{ inputs.source || github.sha }}
      merge-gate: false
      recipe: rust-cli
      runner: ubuntu-24.04
      timeout-minutes: 110
  full-validation:
    name: Full validation
    if: always()
    needs: [validate, complete]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Require the complete current source validation
        timeout-minutes: 1
        uses: nicodes/cookbook/ci-result@2f33aab302c9645f43a5e627850dc06fdba39073
        with:
          event-name: ${{ github.event_name }}
          needs: ${{ toJSON(needs) }}
