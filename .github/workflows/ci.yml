name: CI

# Every push and pull request: build, then test, on one runner.
#
# Nothing is published, so a green CI means one thing — this commit is good.
#
# One job, because a job is a machine: two would each pay their own checkout and
# their own toolchain to split one green tick in two. The phases are separate
# STEPS, so the log still shows which is which and a failure still says so.
#
# The steps are .github/actions/*, the same ones Release runs. There is one
# definition of each, and it is the one guarding a release; two would drift in a
# single direction, with the release-side copy trimmed for speed until it no
# longer matched what people trust on a pull request.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    # Bounded, so a step that hangs fails here rather than sitting until the
    # runner's own timeout hours later. The Go suite alone is allowed 5m.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          # Read from go.mod rather than pinned here, so the version lives in
          # one place and a bump cannot leave CI testing the old one.
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # Built first: a compile error should fail before a test suite spends
      # five minutes reaching the same conclusion more slowly.
      - name: Test
        uses: ./.github/actions/test

      - name: Build
        uses: ./.github/actions/build
