name: Build & Test
'on':
  push:
    branches:
    - main
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
    - name: Check out source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 2
        persist-credentials: false
      timeout-minutes: 5
    - name: Set up development tools
      uses: nicodes/tools/setup@87da2fe9d430c67d15f62f603b07ba1ed40b5603
      env:
        GH_TOKEN: ${{ github.token }}
      timeout-minutes: 5
    - name: Record tested integration identity
      if: github.event_name == 'pull_request'
      env:
        EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      shell: bash
      run: python3 "$TOOLS_ROOT/helpers/integration-identity.py"
    - name: Upload artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: github.event_name == 'pull_request'
      with:
        name: fleet-integration-${{ github.run_id }}-${{ github.run_attempt }}
        path: .artifacts/fleet-integration.json
        if-no-files-found: error
        retention-days: 7
    - name: Cache Go build
      timeout-minutes: 10
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: go-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum', 'mise.toml') }}-${{ github.sha }}
        restore-keys: |
          go-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum', 'mise.toml') }}-
    - name: Run engineering stage
      timeout-minutes: 42
      shell: bash
      env:
        BASE: ${{ github.event.pull_request.base.sha || github.sha }}
        VERSION: dev
      run: mise run check
    - name: Verify independent deployment on disposable Alpine
      timeout-minutes: 30
      shell: bash
      run: |
        set -euo pipefail
        sudo install -d -m 700 /root/komizo-independent-ci/release
        sudo /usr/bin/python3 tools/engineering/cold-lifecycle-acceptance.py \
          --release v0.0.0 --source "$GITHUB_SHA" --release-dir /root/komizo-independent-ci/release \
          --candidate-cli "$GITHUB_WORKSPACE/dist/komizo_Linux_x86_64/komizo" --candidate-host --deployment-only \
          --output /root/komizo-independent-ci/observations
        sudo /usr/bin/python3 tools/engineering/candidate_evidence.py --observations /root/komizo-independent-ci/observations \
          --output "$GITHUB_WORKSPACE/.artifacts/independent-deployment" --source "$GITHUB_SHA"
        sudo chown -R "$(id -u):$(id -g)" .artifacts/independent-deployment
    - name: Retain provisional deployment evidence
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: independent-deployment-${{ github.run_id }}-${{ github.run_attempt }}
        path: .artifacts/independent-deployment
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 30
    permissions:
      contents: read
      attestations: read
