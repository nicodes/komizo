name: "Native executables"
'on':
  workflow_call:
    inputs:
      version:
        type: string
        default: dev
permissions:
  contents: read
jobs:
  native:
    name: API (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
        - runner: ubuntu-24.04
          platform: Linux_x86_64
        - runner: ubuntu-24.04-arm
          platform: Linux_arm64
        - runner: macos-15-intel
          platform: Darwin_x86_64
        - runner: macos-15
          platform: Darwin_arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      MISE_GITHUB_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
    steps:
    - name: Check out source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Set up development tools
      uses: nicodes/tools/setup@a1c0321f3b4917a7e99eca42e241e46670f6e1e1
      env:
        GH_TOKEN: ${{ github.token }}
    - name: Install static Linux linker
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
    - name: Verify native Rust API
      run: |-
        set -euo pipefail
        npm ci --prefix app --no-audit --no-fund
        npm run build --prefix app
        rustup component add --toolchain 1.94.0 rustfmt clippy
        cargo fmt --manifest-path api/Cargo.toml --check
        cargo clippy --locked --manifest-path api/Cargo.toml --all-targets -- -D warnings
        cargo test --locked --manifest-path api/Cargo.toml
        bash scripts/engineering/build-api.sh
        python3 scripts/engineering/api-payload.py ".artifacts/native-api/komizo-api_${{ matrix.platform }}"
        KOMIZO_API_PAYLOAD="$PWD/.artifacts/native-api/payload.gz" cargo build --locked --bin komizo
        python3 scripts/engineering/api-smoke.py "${CARGO_TARGET_DIR:-target}/debug/komizo"
    - name: Verify native host modes and embedded Axum API
      run: |-
        set -euo pipefail
        cargo fmt --all --check
        cargo clippy --locked --all-targets -- -D warnings
        cargo test --locked --test host_modes --test flags --test host_application --test caller_commands --test caller_keys_doctor
        KOMIZO_API_PAYLOAD="$PWD/.artifacts/native-api/payload.gz" cargo clippy --locked --lib --bin komizo-box -- -D warnings
        KOMIZO_API_PAYLOAD="$PWD/.artifacts/native-api/payload.gz" cargo test --locked --test host_modes
        bash scripts/engineering/build-native-host.sh
    - name: Verify source-installed host packaging
      if: matrix.platform == 'Linux_x86_64'
      timeout-minutes: 15
      run: cargo test --locked --test source_build -- --ignored --nocapture
    - name: "Upload artifacts"
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: native-api-${{ matrix.platform }}
        path: .artifacts/native-api/*
        if-no-files-found: error
        include-hidden-files: true
        retention-days: 7
    - name: "Upload artifacts"
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: native-host-${{ matrix.platform }}
        path: .artifacts/native-host/*
        if-no-files-found: error
        retention-days: 7

  cli:
    name: CLI (${{ matrix.platform }})
    needs: native
    strategy:
      fail-fast: false
      matrix:
        include:
        - runner: ubuntu-24.04
          platform: Linux_x86_64
        - runner: ubuntu-24.04-arm
          platform: Linux_arm64
        - runner: macos-15-intel
          platform: Darwin_x86_64
        - runner: macos-15
          platform: Darwin_arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      MISE_GITHUB_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
    steps:
    - name: Check out source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Set up development tools
      uses: nicodes/tools/setup@a1c0321f3b4917a7e99eca42e241e46670f6e1e1
      env:
        GH_TOKEN: ${{ github.token }}
    - name: Install static Linux linker
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
    - name: "Download artifacts"
      uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
      with:
        name: native-api-${{ matrix.platform }}
        path: .artifacts/native-api
    - name: "Download artifacts"
      uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
      with:
        pattern: native-host-Linux_*
        merge-multiple: true
        path: .artifacts/native-host
    - name: Build native bundled workstation executable
      run: bash scripts/engineering/build-native-cli.sh
    - name: "Upload artifacts"
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: native-cli-${{ matrix.platform }}
        path: .artifacts/native-cli/*
        if-no-files-found: error
        retention-days: 7
