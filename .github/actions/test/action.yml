name: Test
description: >
  Is this commit good. Nothing is built for release here and nothing is
  published; a failure means the code is wrong, not that the pipeline is.

  A composite action rather than a reusable workflow so it runs in the caller's
  job, under the caller's name — CI / test, Release / test — rather than as a
  nested "caller / callee" check.

  One definition, called by CI and by Release both. Two would drift in a single
  direction: the copy guarding the release gets trimmed to make releases
  faster, until it no longer matches the one people trust on a pull request.

  Assumes Go is already set up. The caller does that, because the toolchain
  version and its cache keys are a property of the job rather than of this
  step, and two actions in one job would otherwise install it twice.

runs:
  using: composite
  steps:
    # Cheapest first, and the one most likely to be the only thing wrong.
    - name: Go formatting
      shell: bash
      run: |
        unformatted="$(gofmt -l .)"
        if [ -n "$unformatted" ]; then
          echo "::error::gofmt would change these files:"
          echo "$unformatted"
          exit 1
        fi

    - name: Go vet
      shell: bash
      run: go vet ./...

    # Checked BEFORE the tests, because one of them is the shellcheck gate and it
    # skips itself when the tool is absent. A skip is what a contributor without
    # shellcheck should get; a skip in CI is the check quietly not happening,
    # which is the same as not having it.
    #
    # THE VERSION, not just the presence -- komizo#59. This step used to fall
    # back to `apt-get install shellcheck`, which on ubuntu-latest is 0.9.0,
    # while `make check` fell back to koalaman/shellcheck:stable, which is
    # 0.11.0. Different tools with different rules, so "shellcheck clean" meant
    # two different things and a change verified locally could fail here on a
    # line that was correct: 0.9.0 raises SC2015 on `A && B || continue` and
    # 0.11.0 does not, because `continue` is flow control.
    #
    # The pin lives in .mise.toml, mise-action installs it in the caller's job,
    # and this asserts it arrived. No apt fallback: a fallback is how the wrong
    # version got here in the first place, and a lint run by an unknown tool is
    # not the lint anybody reviewed.
    - name: The pinned shellcheck is what is installed
      shell: bash
      run: |
        set -euo pipefail
        want="$(sed -n 's/^shellcheck *= *"\(.*\)"$/\1/p' .mise.toml)"
        if [ -z "$want" ]; then
          echo "::error::.mise.toml pins no shellcheck version, so there is nothing for this to be"
          exit 1
        fi
        if ! command -v shellcheck >/dev/null 2>&1; then
          echo "::error::shellcheck is not on PATH -- mise did not install the pin, and every shell check below would SKIP itself green"
          exit 1
        fi
        got="$(shellcheck --version | sed -n 's/^version: //p')"
        if [ "$got" != "$want" ]; then
          echo "::error::.mise.toml pins shellcheck $want but $got is on PATH. Those disagree about real rules, so this run would not be the check the pin describes."
          exit 1
        fi
        echo "shellcheck $got, as pinned"

    # -race because the TUI runs commands as goroutines writing to a channel the
    # model reads, which is exactly the shape that fails only under load.
    #
    # -count=1 because a cached PASS from an earlier run is not evidence about
    # this one, and the cache is keyed on inputs this suite deliberately reaches
    # outside of: it shells out to sh and to shellcheck, and writes and executes
    # files in a temp directory.
    #
    # The shell komizo pipes to a server as root is checked in here rather than
    # in a step of its own. A step could only glob scripts/*.sh, which misses
    # the deploy script and the secret helper -- those are templates INSIDE
    # alpine.sh, so to the outer shell they are the body of a quoted heredoc,
    # which parses whatever it contains. They run as root on every deploy.
    #
    # Only a Go test can reach them, because they exist only once Go has
    # substituted them: see TestShellcheck, TestEveryShippedTemplatePassesShellcheck
    # and the rest of the ./scripts package, which share one heredoc scan so a
    # template added later cannot escape any of them.
    #
    # KOMIZO_REQUIRE_SHELLCHECK turns every shellcheck test's skip into a
    # failure. docs/checks.md #1: in CI a missing tool is the check not
    # happening, and a skip is a green tick. The step above already refuses to
    # continue without the pinned version, so this is the second lock on the
    # same door -- and it is the one that keeps working if that step is ever
    # reordered or removed.
    - name: Go tests
      shell: bash
      env:
        KOMIZO_REQUIRE_SHELLCHECK: "1"
      run: go test -race -count=1 -timeout 5m ./...

    # A skipped test is a green tick, so assert the shell gates actually ran.
    #
    # THIS STEP HAD THAT EXACT DEFECT. It ran
    # `-run 'TestShellcheck|TestEveryGeneratedScriptIsValidShell'` against
    # ./internal/app. TestShellcheck had moved to ./scripts and
    # TestEveryGeneratedScriptIsValidShell no longer existed under that name
    # anywhere, so the pattern matched nothing: `go test` printed "no tests to
    # run", exited 0, and produced no `--- SKIP` line for the grep to find. The
    # guard against a check that is green because it never ran was itself green
    # because it never ran. docs/checks.md #1, in the file that edits it.
    #
    # A NAME LIST IS THE WRONG SHAPE HERE -- it is the thing that went stale,
    # and this PR takes the shell checks from five to eleven, which would have
    # made it staler. The whole ./scripts package runs instead: it is the
    # package that exists to check shell, every test in it needs `sh` or
    # shellcheck, and one added to it is covered without anybody editing this.
    #
    # "no tests to run" is checked FIRST and on its own, because that is the
    # failure that actually happened and it is invisible in every other signal:
    # green step, short output, and nothing saying the number of assertions was
    # zero. `--- PASS` is required from the other side, because an empty package
    # and a passing one differ only in that line.
    - name: The shell checks were not skipped
      shell: bash
      env:
        KOMIZO_REQUIRE_SHELLCHECK: "1"
      run: |
        set -euo pipefail
        out="$(go test -count=1 -v ./scripts)"
        echo "$out"
        if grep -q 'no tests to run\|\[no test files\]' <<<"$out"; then
          echo "::error::the shell gate matched no tests -- it has been renamed or moved, and this guard has been passing on an empty run"
          exit 1
        fi
        if ! grep -q -- '--- PASS' <<<"$out"; then
          echo "::error::the shell gate produced no passing test, so nothing was actually checked"
          exit 1
        fi
        if grep -q -- '--- SKIP' <<<"$out"; then
          echo "::error::a shell check skipped itself -- the tool it needs is missing from this image"
          exit 1
        fi
