[package]
name = "komizo"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace]
exclude = ["api"]

[dependencies]
anyhow = "1"
aws-lc-rs = "1.19"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
getrandom = "0.4"
libc = "0.2"
regex = "1"
regex-syntax = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "preserve_order"] }
sha2 = "0.10"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
