version = 1
recipe = "rust-cli"

[[components.rust]]
name = "api"
manifest = "crates/api/Cargo.toml"
binaries = ["komizo-api"]
profile = "release"
[components.rust.test]
native_host = true
[components.rust.lint]
native_host = true

[[components.rust]]
name = "cli"
manifest = "Cargo.toml"
profile = "release"
[components.rust.test]
enabled = false
[components.rust.lint]
native_host = true
all_targets = false
lib = true
binaries = ["komizo-box", "komizo"]

[[components.rust]]
name = "cli-source"
manifest = "Cargo.toml"
[components.rust.build]
enabled = false
[components.rust.test]
native_host = true
[components.rust.lint]
native_host = true
all_targets = true

[[components.rust_tests]]
name = "native-api-unit"
component = "api"
roles = ["api"]
selectors = {native_host=true}

[[components.rust_tests]]
name = "native-owner-plain"
component = "cli-source"
roles = ["host"]
dependency_context = "none"
selectors = {native_host=true,lib=true,test_targets=["deployment_assets","deployment_authority","deployment_contract","deployment_controller","deployment_data","deployment_native","deployment_recovery","deployment_resources","deployment_secrets","deployment_store","source_build"]}

[[components.rust_tests]]
name = "source-installed-owner"
component = "cli-source"
roles = ["host"]
platforms = ["Linux/x86_64"]
suite = "build"
reuse_native_build = true
dependency_context = "none"
selectors = {native_host=true,test_targets=["source_build"],test_arguments=["--ignored","--nocapture"]}

[[components.native]]
name = "api"
role = "api"
component = "api"
binary = "komizo-api"
output = ".artifacts/native-api/komizo-api_{platform}_{arch}"
environment = {SOURCE_COMMIT="{commit}"}

[[components.native]]
name = "host"
role = "host"
component = "cli"
binary = "komizo-box"
output = ".artifacts/native-host/komizo-box_{platform}_{arch}"
environment = {KOMIZO_VERSION="{version}"}

[[components.native]]
name = "cli"
role = "cli"
component = "cli"
binary = "komizo"
output = ".artifacts/native-cli/komizo_{platform}_{arch}"
environment = {KOMIZO_VERSION="{version}"}
checks = ["tests/acceptance/api-smoke.py"]
[[components.native.needs]]
component = "api"
platform = "native"
path_environment = "KOMIZO_API_PAYLOAD"
compression = "gzip"
output = ".artifacts/native-api/payload_{platform}_{arch}.gz"

[[components.ui]]
required_files = ["index.html"]

[[node.packages]]
directory = "app"
manager = "npm"
build = "build"
typecheck = "typecheck"
test = "test"

[package]
binary = "komizo"
files = ["README.md", "LICENSE"]
version_arguments = ["version"]
version_template = "{binary} {version}"
extra_files = ["komizo-box_Linux_x86_64", "komizo-box_Linux_arm64", "caddy_Linux_x86_64", "caddy_Linux_arm64"]

[package.extra_file_sources.komizo-box_Linux_x86_64]
component = "host"
platform = "Linux/x86_64"

[package.extra_file_sources.komizo-box_Linux_arm64]
component = "host"
platform = "Linux/arm64"

[package.extra_file_sources.caddy_Linux_x86_64]
provider = "caddy"
platform = "Linux/x86_64"

[package.extra_file_sources.caddy_Linux_arm64]
provider = "caddy"
platform = "Linux/arm64"

[[package.native_targets]]
runner = "ubuntu-24.04"
timeout_minutes = 45
second_wave_timeout_minutes = 35
target = "x86_64-unknown-linux-musl"
platform = "Linux"
arch = "x86_64"
extension = "tar.gz"

[[package.native_targets]]
runner = "ubuntu-24.04-arm"
timeout_minutes = 45
second_wave_timeout_minutes = 35
target = "aarch64-unknown-linux-musl"
platform = "Linux"
arch = "arm64"
extension = "tar.gz"

[[package.native_targets]]
runner = "macos-15-intel"
timeout_minutes = 45
second_wave_timeout_minutes = 35
target = "x86_64-apple-darwin"
platform = "Darwin"
arch = "x86_64"
extension = "tar.gz"

[[package.native_targets]]
runner = "macos-15"
timeout_minutes = 45
second_wave_timeout_minutes = 35
target = "aarch64-apple-darwin"
platform = "Darwin"
arch = "arm64"
extension = "tar.gz"

[artifacts]
evidence_paths = [".artifacts/security/rust-source.json", ".artifacts/independent-deployment/candidate-deployment.json", ".artifacts/independent-deployment/cleanup.json"]

[lint]
shell_paths = ["install.sh", "tests/acceptance/cold-client.sh"]

[security]
rust_inventory_manifests = ["Cargo.toml", "crates/api/Cargo.toml"]

[[tests.unit]]
runner = "python-unittest"
path = "tests/acceptance"
pattern = "test_acceptance.py"

[[tests.unit]]
runner = "python-unittest"
path = "tests/acceptance"
pattern = "test_native_release.py"

[[tests.unit]]
runner = "python-unittest"
path = "tests/acceptance"
pattern = "test_native_root.py"

[[tests.unit]]
runner = "python-unittest"
path = "tests/acceptance"
pattern = "test_native_performance*.py"

[[tests.unit]]
runner = "python-unittest"
path = "tests/acceptance"
pattern = "test_native_sdk.py"

[[tests.unit]]
runner = "python"
path = "tests/acceptance/native-root-tests.py"
timeout = 900

[[tests.integration]]
runner = "python"
path = "tests/acceptance/api-smoke.py"
args = ["{binary}"]

[[tests.integration]]
runner = "bash"
path = "tests/acceptance/cold-client.sh"

[[tests.e2e]]
runner = "python"
path = "tests/acceptance/independent_deployment_test.py"
args = ["--binary", "{binary}", "--source", "{commit}"]
timeout = 1800

[ci]
timeout_minutes = 110

[clean]
paths = ["dist", "target", ".artifacts/build", ".artifacts/rust-target", ".artifacts/native-package", ".artifacts/native-api", ".artifacts/native-host", ".artifacts/native-cli", ".artifacts/native-archives", ".artifacts/native-proxy", ".artifacts/advisory-db", ".artifacts/security", ".artifacts/ui", ".artifacts/independent-deployment", "app/node_modules"]

[publication]
tag_prefix = "v"
initial = "first"
version_identity = "number"
validation_timeout = 110
acceptance_timeout = 55
attestation_platforms = ["Linux/x86_64", "Linux/arm64", "Darwin/x86_64", "Darwin/arm64"]

[publication.acceptance]
files = ["komizo-acceptance.json", "komizo-performance.json"]
diagnostics = ["cleanup-status.json", "status.json"]

[[publication.acceptance.checks]]
runner = "python"
path = "tests/acceptance/release_lifecycle_test.py"
args = ["--artifacts", "{dist}", "--evidence", "{evidence}", "--release", "{tag}", "--source", "{source}"]
timeout = 2400

[[publication.acceptance.verification]]
runner = "python"
path = "tests/acceptance/release_acceptance.py"
args = ["--bundle", "{evidence}", "--artifacts", "{dist}", "--release", "{tag}", "--source", "{source}"]
timeout = 120
