[package]
name = "komizo-api"
version = "0.3.0"
edition = "2024"
rust-version = "1.94"
publish = false

[dependencies]
axum = "=0.8.9"
aws-lc-rs = "1.19"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1"
form_urlencoded = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["http1", "tokio", "service"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "sync", "time", "io-util", "fs", "process"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
